<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>설문 리포트</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e4e2da;--accent:#2f4f3e;--soft:#eef2ee;--err:#b94b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 2px}
input,select,button,textarea{font:inherit}
input[type=text],input[type=password],input[type=url],select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
button{padding:8px 12px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;cursor:pointer}
button.ghost{background:#fff;color:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:#fff;color:var(--accent)}.tabs button[aria-selected=true]{background:var(--accent);color:#fff}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;white-space:nowrap}
td.text{white-space:normal;min-width:200px}
th{background:var(--soft);position:sticky;top:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.err{color:var(--err)}
.dup{color:var(--muted);text-decoration:line-through}
ul.lines{list-style:none;padding:0;margin:0}ul.lines li{padding:6px 0;border-bottom:1px solid var(--line)}
.prefix{color:var(--accent);font-weight:600}
textarea{min-height:200px;font-family:ui-monospace,monospace;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
[hidden]{display:none!important}
@media (max-width:600px){main{padding:10px}.row button{flex:1 1 45%}}
</style>
</head>
<body>
<main>
<h1 id="title">설문 리포트</h1>

<section class="card" id="inputs">
  <label for="survey-url">survey.json 주소 (또는 surveyId)</label>
  <input type="text" id="survey-url" autocomplete="off" placeholder="../surveys/&lt;id&gt;/survey.json">
  <label for="source">응답 소스</label>
  <select id="source">
    <option value="collector">수집 서버 (collector)</option>
    <option value="file">파일 업로드 (jsonl / gform-csv)</option>
  </select>
  <div id="src-collector">
    <label for="endpoint">collector 주소</label>
    <input type="url" id="endpoint" autocomplete="off" placeholder="https://collector.example">
    <label for="secret">리포트 비밀번호 (이 탭에서만 유지됩니다)</label>
    <input type="password" id="secret" autocomplete="off">
  </div>
  <div id="src-file" hidden>
    <label for="file">파일 형식</label>
    <select id="file-kind"><option value="jsonl">jsonl</option><option value="gform-csv">gform-csv (Sheet CSV)</option></select>
    <label for="file">파일</label>
    <input type="file" id="file" accept=".jsonl,.json,.csv,.txt">
  </div>
  <p><button id="load" type="button">불러오기</button> <span id="status" class="muted" role="status"></span></p>
</section>

<div id="report" hidden>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="a" aria-selected="true">A 응답</button>
    <button type="button" role="tab" data-tab="b" aria-selected="false">B 요약</button>
    <button type="button" role="tab" data-tab="c" aria-selected="false">C 문항별</button>
    <button type="button" role="tab" data-tab="d" aria-selected="false">D 주관식</button>
    <button type="button" role="tab" data-tab="e" aria-selected="false">E 복사</button>
  </div>
  <section class="card" data-view="a" id="view-a"></section>
  <section class="card" data-view="b" id="view-b" hidden></section>
  <section class="card" data-view="c" id="view-c" hidden></section>
  <section class="card" data-view="d" id="view-d" hidden></section>
  <section class="card" data-view="e" id="view-e" hidden>
    <h2>보고서용 복사</h2>
    <div class="row">
      <button type="button" id="copy-all">전체 복사</button>
      <button type="button" id="copy-scores">점수형만 복사</button>
      <button type="button" id="copy-text">주관식만 복사</button>
      <button type="button" id="copy-prompt" class="ghost">AI 프롬프트 복사</button>
    </div>
    <p id="copy-status" class="muted" role="status"></p>
    <label for="copy-out">복사 내용</label>
    <textarea id="copy-out" readonly></textarea>
    <label for="ai-prompt">AI 보고서 프롬프트</label>
    <textarea id="ai-prompt" readonly></textarea>
    <p class="muted">.xlsx 파일은 <code>node tools/report.mjs &lt;survey.json&gt; --source jsonl|gform-csv &lt;file&gt; --out &lt;dir&gt;</code> 로 생성합니다.</p>
  </section>
</div>
</main>
<script type="module" src="./report.js"></script>
</body>
</html>
